# ─────────────────────────────────────────────────────────────────────────────
# Franilover/Game — Build & Release con Godot 4.7
# project.godot: config/features=PackedStringArray("4.7", "GL Compatibility")
#
# Disparar:  git tag v0.X && git push --tags
# O:         Actions → Run workflow
# ─────────────────────────────────────────────────────────────────────────────
name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nombre del release (ej: v0.5-beta)"
        required: false
        default: "dev-build"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  build:
    name: Export Godot 4.7 → GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── Godot headless ───────────────────────────────────────────────────
      - name: Instalar Godot 4.7-stable
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FILENAME}.zip"
          echo "Descargando: $URL"
          wget -q "$URL"
          unzip -q "${FILENAME}.zip"
          mv "${FILENAME}" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # ── Export templates ─────────────────────────────────────────────────
      - name: Instalar export templates 4.7
        run: |
          TPZ="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TPZ}"
          echo "Descargando templates: $URL"
          wget -q "$URL"
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q "${TPZ}" -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATE_DIR/"
          echo "Templates instalados en: $TEMPLATE_DIR"
          ls "$TEMPLATE_DIR/" | head -10

      # ── Export ───────────────────────────────────────────────────────────
      - name: Preparar carpeta EXPORT
        run: mkdir -p EXPORT

      - name: Export Windows Desktop
        run: |
          godot --headless --export-release "Windows Desktop" EXPORT/Garlia.exe 2>&1
          echo "Windows: $(ls -lh EXPORT/Garlia.exe 2>/dev/null || echo 'FALLIDO')"

      - name: Export Linux
        run: |
          godot --headless --export-release "Linux" EXPORT/Garlia.x86_64 2>&1
          chmod +x EXPORT/Garlia.x86_64
          echo "Linux: $(ls -lh EXPORT/Garlia.x86_64 2>/dev/null || echo 'FALLIDO')"

      # Android — activar cuando configures el preset desde Godot local:
      #   Proyecto → Exportar → Añadir → Android → guardar → commit export_presets.cfg
      # - name: Export Android
      #   run: |
      #     godot --headless --export-release "Android" EXPORT/Garlia.apk 2>&1

      - name: Verificar exports
        run: ls -lh EXPORT/

      # ── Publicar Release ─────────────────────────────────────────────────
      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name || 'dev-build' }}
          name: "Garlia ${{ github.ref_name || inputs.tag_name || 'dev-build' }}"
          body: |
            ## Garlia — ${{ github.ref_name || inputs.tag_name }}

            | Plataforma | Archivo |
            |------------|---------|
            | 🪟 Windows | `Garlia.exe` |
            | 🐧 Linux   | `Garlia.x86_64` |

            > Android próximamente.
          files: |
            EXPORT/Garlia.exe
            EXPORT/Garlia.x86_64
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
