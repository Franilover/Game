name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nombre del release (ej: v0.5-beta)"
        required: false
        default: "dev-build"

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"

jobs:
  build:
    name: Export Godot 4.7 — Windows, Linux y Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar paquetes Android requeridos
        run: |
          set -eu
          yes | sdkmanager --licenses
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Instalar Godot 4.7 stable
        run: |
          set -euo pipefail
          FILENAME="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${FILENAME}.zip"
          wget -q "$URL"
          unzip -q "${FILENAME}.zip"
          sudo mv "${FILENAME}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Instalar export templates Godot 4.7
        run: |
          set -euo pipefail
          TPZ="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/${TPZ}"
          wget -q "$URL"

          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot-templates
          unzip -q "$TPZ" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Preparar carpeta EXPORT
        run: mkdir -p EXPORT

      - name: Restaurar clave de depuración Android
        uses: actions/cache@v4
        with:
          path: ~/.android/garlia-debug.keystore
          key: garlia-android-debug-keystore-v1

      - name: Crear clave de depuración Android si no existe
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          if [[ ! -f "$HOME/.android/garlia-debug.keystore" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/garlia-debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configurar rutas Android en Godot
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          test -n "${JAVA_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$JAVA_HOME"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/garlia-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Importar recursos del proyecto
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import

      - name: Export Windows Desktop
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Windows Desktop" EXPORT/Garlia.exe
          test -s EXPORT/Garlia.exe
          ls -lh EXPORT/Garlia.exe

      - name: Export Linux
        run: |
          set -euo pipefail
          godot --headless --path . --export-release "Linux" EXPORT/Garlia.x86_64
          chmod +x EXPORT/Garlia.x86_64
          test -s EXPORT/Garlia.x86_64
          ls -lh EXPORT/Garlia.x86_64

      - name: Actualizar versión Android en export_presets.cfg
        run: |
          set -euo pipefail

          # Obtener el tag: v0.1.5 desde push, o el input en workflow_dispatch
          RAW_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'dev-build' }}"

          # version/name: sacar la "v" del principio → "0.1.5"
          VERSION_NAME="${RAW_TAG#v}"

          # version/code: convertir X.Y.Z a un entero único → X*10000 + Y*100 + Z
          # Ejemplo: 0.1.5 → 105 | 1.2.3 → 10203 | 0.10.0 → 1000
          # Para tags que no sean semver (ej: dev-build) usa 1 como fallback.
          if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            # versionCode mínimo es 1
            [[ $VERSION_CODE -lt 1 ]] && VERSION_CODE=1
          else
            VERSION_CODE=1
          fi

          echo "Tag:          $RAW_TAG"
          echo "version/name: $VERSION_NAME"
          echo "version/code: $VERSION_CODE"

          # Reemplazar en export_presets.cfg (solo en el preset de Android)
          sed -i "s|^version/code=.*|version/code=${VERSION_CODE}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${VERSION_NAME}\"|" export_presets.cfg

          # Verificar que el reemplazo funcionó
          grep "^version/" export_presets.cfg

      - name: Export Android APK de prueba
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/garlia-debug.keystore"

          godot --headless --path . --export-debug "Android" EXPORT/Garlia.apk
          test -s EXPORT/Garlia.apk
          ls -lh EXPORT/Garlia.apk

      - name: Verificar exports
        run: |
          set -euo pipefail
          ls -lh EXPORT/
          test -s EXPORT/Garlia.exe
          test -s EXPORT/Garlia.x86_64
          test -s EXPORT/Garlia.apk

      - name: Publicar en GitHub Releases
        timeout-minutes: 15
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'dev-build' }}
          name: "Garlia ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'dev-build' }}"
          body: |
            ## Garlia

            | Plataforma | Archivo |
            |---|---|
            | Windows | `Garlia.exe` |
            | Linux | `Garlia.x86_64` |
            | Android (APK de prueba) | `Garlia.apk` |

            La APK está firmada con una clave de depuración para instalación y pruebas directas.
            No está destinada a publicarse en Google Play.
          files: |
            EXPORT/Garlia.exe
            EXPORT/Garlia.x86_64
            EXPORT/Garlia.apk
          make_latest: true
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
