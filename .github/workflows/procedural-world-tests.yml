name: Procedural World Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/world/procedural/**"
      - "scripts/world/world_terrain*.gd"
      - "scripts/creatures/**"
      - "tests/creatures/**"
      - "addons/TileMapDual/**"
      - "tests/world/**"
      - "project.godot"
      - ".github/workflows/procedural-world-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/world/procedural/**"
      - "scripts/world/world_terrain*.gd"
      - "scripts/creatures/**"
      - "tests/creatures/**"
      - "addons/TileMapDual/**"
      - "tests/world/**"
      - "project.godot"
      - ".github/workflows/procedural-world-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  procedural-kernel:
    name: Godot 4.7 headless kernel tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          filename="Godot_v4.7-stable_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/4.7-stable/${filename}.zip"
          unzip -q "${filename}.zip"
          sudo install "${filename}" /usr/local/bin/godot
          godot --version

      - name: Import resources and reject script compilation errors
        shell: bash
        run: |
          set -euo pipefail
          output="$(godot --headless --editor --path . --quit 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if grep -E 'SCRIPT ERROR: Parse Error|SCRIPT ERROR: Compile Error|Failed to load script' <<<"$output"; then
            echo "Godot reported script compilation errors during import."
            exit 1
          fi

      - name: Run creature AI target policy regression test
        run: godot --headless --path . --script res://tests/creatures/test_creature_ai_target_policy.gd

      - name: Run procedural kernel smoke tests
        run: godot --headless --path . --script res://tests/world/test_world_generator_kernel.gd

      # Verifies stable atlas registration and real DisplayLayer composition.
      - name: Run TileMapDual terrain regression test
        run: godot --headless --path . --script res://tests/world/test_world_terrain_visual.gd
